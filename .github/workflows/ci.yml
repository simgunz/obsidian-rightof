name: CI

on:
    push:
        branches: ['**']
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - run: npm ci
            - run: npm run lint
            - run: npm test
            - run: npm run build
