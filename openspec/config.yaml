schema: spec-driven

context: |
  Right Of is an Obsidian community plugin that renders reladraw diagrams
  (https://github.com/reladraw/reladraw) written in ```reladraw code blocks.
  reladraw is a text diagram language where the source states where things go.
  The plugin is called "Right Of", never "reladraw": reladraw's NOTICE reserves
  its name for the upstream project. Describing the origin ("renders reladraw
  diagrams") is fine.

  Platform: Obsidian desktop only (manifest isDesktopOnly: true). No mobile work.
  reladraw is pinned to an exact version (0.15.1) because its syntax still changes.

  Stack: TypeScript, the obsidian-sample-plugin layout (esbuild bundles src/main.ts
  to main.js at the repo root), vitest with jsdom for tests, eslint with
  eslint-plugin-obsidianmd. Run everything with npm scripts: test, build, lint.

  Conventions:
  - Pure logic lives in modules that do not import `obsidian`, so vitest can test
    it directly. Obsidian glue (render children, modals, commands) stays thin.
  - Never assign innerHTML. Turn reladraw's SVG string into DOM with DOMParser.
  - Style with Obsidian CSS variables so the plugin follows the user's theme.
    Prefix every CSS class with `rightof-`.
  - UX follows Obsidian and the common diagram-plugin patterns: a static diagram
    in the note, Obsidian's own edit button, zoom and pan only in a modal.
  - Spec domains are named after user-facing features (diagram-rendering,
    diagram-modal).
